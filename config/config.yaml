# =============================
# Dashcam Configuration
# =============================

storage:
  clip_dir: "videos"
  max_storage_gigabytes: 12  # 12 GB

obd:
  port: "/tmp/ttyCarly"
  enabled: true
  commands:
    - name: "RPM"
      address: "010C"
    - name: "Speed"
      address: "010D"
    - name: "Coolant"
      address: "0105"
    - name: "Intake Temp"
      address: "010F"
    - name: "Oil Temp"
      address: "221310"
    - name: "Load"
      address: "0104"
    - name: "Timing"
      address: "010E"
    - name: "Rail Press"
      address: "0159"

recording:
  segment_seconds: 60               # Length of each clip (seconds)

camera:
  width: 2304
  height: 1008
  fps: 25
  buffer_count: 30
  codec: "libav"                    # "libav" for software encoding, "h264" for hardware
  hdr: "off"                         # "on" or "off"
  preview: false                      # Show preview window
  extra_args: []                      # Any additional rpicam-vid arguments
  # libav_opts:                       # Overrides for libav codec (uncomment to use)
  #   - "crf=23"
  #   - "preset=superfast"
  #   - "profile=high"
  #   - "maxrate=15M"
  #   - "bufsize=30M"
  #   - "g=25"

ring_buffer:
  check_interval_seconds: 60         # How often to enforce storage limits

