[project]
name = "rpi5-dashcam"
version = "0.1.0"
description = "Raspberry Pi 5 dashcam recorder with OBD telemetry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ble-serial==3.0.0",
    "bleak==3.0.2",
    "numpy==2.5.2",
    "obd==0.7.3",
    "opencv-python==5.0.0.93",
    "pandas==3.0.5",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "flake8==7.3.0",
]
